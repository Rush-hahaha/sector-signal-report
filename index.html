<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>板块信号分析</title>
<style>
:root{--bg:#0d1117;--bg2:#161b22;--ink:#e6edf3;--muted:#8b949e;--rule:#30363d;--accent:#22c55e;--accent2:#f97316;--red:#ef4444;--blue:#3b82f6}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;font-size:15px}
.container{max-width:720px;margin:0 auto;padding:1.2rem 1rem}
h1{font-size:1.4rem;font-weight:700;margin-bottom:.2rem}
.subtitle{color:var(--muted);font-size:.8rem;margin-bottom:1.2rem}
.section{margin-bottom:1.4rem}
.section-title{font-size:1rem;font-weight:700;margin-bottom:.6rem;padding-bottom:.3rem;border-bottom:1px solid var(--rule)}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-bottom:1.2rem}
.kpi{background:var(--bg2);border-radius:8px;padding:.7rem .8rem}
.kpi .label{font-size:.68rem;color:var(--muted)}
.kpi .value{font-size:1.15rem;font-weight:700;line-height:1.3;margin-top:.15rem}
.kpi .sub{font-size:.65rem;color:var(--muted);margin-top:.1rem}
.green{color:var(--accent)}.red{color:var(--red)}.orange{color:var(--accent2)}.blue{color:var(--blue)}
.signal-row{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1.2rem}
.signal-card{background:var(--bg2);border-radius:8px;padding:.9rem;flex:1;min-width:220px}
.signal-card .tag{display:inline-block;font-size:.68rem;font-weight:700;padding:.15rem .5rem;border-radius:4px;margin-bottom:.4rem}
.tag.green{background:#22c55e22;color:var(--accent)}.tag.orange{background:#f9731622;color:var(--accent2)}.tag.red{background:#ef444422;color:var(--red)}.tag.blue{background:#3b82f622;color:var(--blue)}
.signal-card .title{font-size:1rem;font-weight:700}
.signal-card .desc{font-size:.8rem;color:var(--muted);margin-top:.2rem}
.hit{font-size:.85rem;margin-top:.5rem}
table{width:100%;border-collapse:collapse;font-size:.8rem}
thead th{background:var(--bg2);padding:.4rem .5rem;text-align:right;font-weight:600;color:var(--muted);border-bottom:1px solid var(--rule);white-space:nowrap}
thead th:first-child{text-align:left}
tbody td{padding:.45rem .5rem;text-align:right;border-bottom:1px solid var(--rule);white-space:nowrap}
tbody td:first-child{text-align:left;font-weight:600;white-space:normal}
tbody tr:hover{background:var(--bg2)}
.empty-state{text-align:center;padding:1.8rem 1rem;color:var(--muted)}
.empty-state .icon{font-size:1.8rem;margin-bottom:.4rem}
.empty-state .tip{font-size:.8rem;margin-top:.4rem;line-height:1.5}
.note{background:var(--bg2);border-radius:8px;padding:.7rem .9rem;font-size:.82rem;color:var(--ink);margin-bottom:1.2rem;border-left:3px solid var(--blue)}
</style>
</head>
<body>
<div class="container">
<h1>板块信号分析</h1>
<div class="subtitle" id="subtitle">先判环境，再选最优信号 · 命中率目标 ≥ 60%</div>

<div class="kpi-grid" id="kpiGrid"></div>

<div class="section-title">当前信号</div>
<div class="signal-row" id="signalRow"></div>

<div class="section">
  <div class="section-title">触发信号板块</div>
  <div id="sectorTable"></div>
</div>

<div class="section" id="nearSection" style="display:none">
  <div class="section-title">接近触发（监控）</div>
  <div id="nearTable"></div>
</div>

<div class="section">
  <div class="section-title">市场全景</div>
  <div id="overviewTable"></div>
</div>
</div>

<script>
function pct(v){return v>=0?'+'+v.toFixed(1)+'%':v.toFixed(1)+'%'}

fetch('./env_signal_report.json').then(function(r){return r.json()}).then(function(d){
  var m=d.market, s=d.signal, all=d.all_sectors;
  document.getElementById('subtitle').textContent = d.date + ' · 先判环境，再选最优信号 · 命中率目标 ≥ 60%';

  // KPI：只保留市场环境、20日收益、20日振幅
  var html='';
  var kpis=[
    {label:'市场环境',value:m.env_name,cls:m.env==='bull'?'green':m.env==='bear'?'red':'orange',sub:'趋势方向'},
    {label:'20日累计收益',value:pct(m.cum20),cls:m.cum20>0?'green':'red',sub:'等权指数'},
    {label:'20日振幅',value:m.amp20.toFixed(1)+'%',cls:'',sub:'最高最低差/均值'}
  ];
  for(var i=0;i<kpis.length;i++){
    var k=kpis[i];
    html+='<div class="kpi"><div class="label">'+k.label+'</div><div class="value '+k.cls+'">'+k.value+'</div><div class="sub">'+k.sub+'</div></div>';
  }
  document.getElementById('kpiGrid').innerHTML=html;

  // 信号说明（清晰版：明确信号类型 + 触发条件 + 含义）
  var noSignal=s.triggered_count===0;
  var signalDesc;
  if(s.name.indexOf('深度回调')>-1){
    signalDesc='<b>超跌反弹信号</b>：牛市中板块短期深度回调（5日跌幅超过5%）且波动放大，多为主力洗盘，随后反弹概率高。';
  }else if(s.name.indexOf('超跌')>-1){
    signalDesc='<b>超跌反弹信号</b>：板块深度下跌后的均值回归机会。';
  }else{
    signalDesc='信号说明：'+s.desc;
  }
  var hitHtml='';
  if(s.hit_t5!==null){
    hitHtml='<div class="hit"><span class="green">T+5 命中率 '+s.hit_t5+'%</span> &nbsp;|&nbsp; <span class="green">T+20 命中率 '+s.hit_t20+'%</span></div>';
  }
  document.getElementById('signalRow').innerHTML=
    '<div class="signal-card"><div class="tag '+(noSignal?'orange':'green')+'">'+(noSignal?'当前未触发':'当前触发')+'</div><div class="title">'+s.name+'</div><div class="desc">'+signalDesc+'</div><div class="desc" style="color:var(--muted)">触发条件：'+s.desc+'</div>'+hitHtml+'</div>'+
    '<div class="signal-card"><div class="tag blue">方法论</div><div class="title">环境自适应</div><div class="desc">先判市场环境（牛市/熊市/震荡），再选该环境下历史命中率最高（≥60%）的信号组合。震荡市中超跌反弹信号未达标，统一观望。</div></div>';

  // 触发板块（精简：去掉波动率与成交额）
  if(secsEmpty()){
    document.getElementById('sectorTable').innerHTML='<div class="empty-state"><div class="icon">✓</div><div>当前无板块触发超跌反弹信号</div><div class="tip">牛市趋势中板块普遍上涨，缺乏深度回调，这是正常现象 —— 趋势延续时无需追空。</div></div>';
  }else{
    var h='<table><thead><tr><th>板块</th><th>5日收益</th><th>20日收益</th></tr></thead><tbody>';
    for(var i=0;i<d.sectors.length;i++){
      h+='<tr><td>'+d.sectors[i].name+'</td><td class="red">'+pct(d.sectors[i].ret5)+'</td><td>'+pct(d.sectors[i].ret20)+'</td></tr>';
    }
    h+='</tbody></table>';
    document.getElementById('sectorTable').innerHTML=h;
  }

  // 接近触发（精简）
  var near=[];
  for(var i=0;i<all.length;i++){
    if(all[i].ret5<-3&&all[i].ret5>=-5) near.push(all[i]);
  }
  near.sort(function(a,b){return a.ret5-b.ret5});
  if(near.length>0){
    document.getElementById('nearSection').style.display='block';
    var nh='<table><thead><tr><th>板块</th><th>5日收益</th><th>20日收益</th></tr></thead><tbody>';
    for(var i=0;i<near.length;i++){
      nh+='<tr><td>'+near[i].name+'</td><td class="red">'+pct(near[i].ret5)+'</td><td>'+pct(near[i].ret20)+'</td></tr>';
    }
    nh+='</tbody></table>';
    document.getElementById('nearTable').innerHTML=nh;
  }

  // 市场全景：涨跌统计 + 涨/跌幅 Top10（精简为收益三列）
  var up5=0,up20=0,up60=0;
  for(var i=0;i<all.length;i++){
    if(all[i].ret5>0) up5++;
    if(all[i].ret20>0) up20++;
    if(all[i].ret60>0) up60++;
  }
  var top5=all.slice().sort(function(a,b){return b.ret5-a.ret5}).slice(0,10);
  var bot5=all.slice().sort(function(a,b){return a.ret5-b.ret5}).slice(0,10);

  var ov='<div class="note"><strong>涨跌统计</strong> &nbsp;'+
    '5日上涨 <span class="green">'+up5+'/'+all.length+'</span> &nbsp;|&nbsp; '+
    '20日上涨 <span class="green">'+up20+'/'+all.length+'</span> &nbsp;|&nbsp; '+
    '60日上涨 <span class="green">'+up60+'/'+all.length+'</span></div>';

  ov+='<table><thead><tr><th colspan="4" style="text-align:left;color:var(--accent)">5日涨幅 Top 10</th></tr></thead>';
  ov+='<thead><tr><th>板块</th><th>5日</th><th>20日</th><th>60日</th></tr></thead><tbody>';
  for(var i=0;i<top5.length;i++){
    ov+='<tr><td>'+top5[i].name+'</td><td class="green">'+pct(top5[i].ret5)+'</td><td>'+pct(top5[i].ret20)+'</td><td>'+pct(top5[i].ret60)+'</td></tr>';
  }
  ov+='</tbody></table>';

  ov+='<br><table><thead><tr><th colspan="4" style="text-align:left;color:var(--red)">5日跌幅 Top 10（回调候选）</th></tr></thead>';
  ov+='<thead><tr><th>板块</th><th>5日</th><th>20日</th><th>60日</th></tr></thead><tbody>';
  for(var i=0;i<bot5.length;i++){
    ov+='<tr><td>'+bot5[i].name+'</td><td class="red">'+pct(bot5[i].ret5)+'</td><td>'+pct(bot5[i].ret20)+'</td><td>'+pct(bot5[i].ret60)+'</td></tr>';
  }
  ov+='</tbody></table>';
  document.getElementById('overviewTable').innerHTML=ov;

  function secsEmpty(){return d.sectors.length===0;}
});
</script>
</body>
</html>
